    <h3 class="section-title heading" id="sn51-balakaraniyavagga">The Chapter on Hard Work </h3>
    <article id="sn51.55-66">
      <h5 class="sutta-title heading">
        <span class="sutta-heading acronym">SN 51.55–66</span>
        <span class="sutta-heading translated-title">Hard Work </span>
        <span class="sutta-heading root-title">Balakaraṇīyavagga</span>
      </h5>
      <p class="expansion-instructions" id="sn51.55-66:1.1">(Tell in full as in the chapter on hard work at SN 45.149–160.) </p>
      <blockquote class="uddanagatha">
        <p id="sn51.55-66:2.1">Hard work, seeds, and dragons, <br/>a tree, a pot, and a spike, <br/>the atmosphere, and two on clouds, <br/>a ship, a guest house, and a river. </p>
      </blockquote>
    </article>
