    <h3 class="section-title heading" id="sn46-esanavagga">The Chapter on Searches </h3>
    <article id="sn46.111-120">
      <h5 class="sutta-title heading">
        <span class="sutta-heading acronym">SN 46.111–120</span>
        <span class="sutta-heading translated-title">Searches, Etc. </span>
        <span class="sutta-heading root-title">Esanāvagga</span>
      </h5>
      <p id="sn46.111-120:1.1">“Mendicants, there are these three searches. What three? The search for sensual pleasures, the search for continued existence, and the search for a spiritual path. …” </p>
      <p class="expansion-instructions" id="sn46.111-120:3.1">(Tell in full as in SN 45.161–170.) </p>
