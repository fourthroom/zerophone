<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests;">
  <title>ZeroPhone Family — Encrypted Browser Video Calling, WebText & Local Resources</title>
  <meta name="description" content="ZeroPhone Family is a completely free, privacy-first web utility featuring end-to-end AES-256-GCM encrypted video calling, voice calls, free WebText, local Wi-Fi maps, and live radio.">
  <link rel="icon" type="image/svg+xml" href="family-icon.svg">
  <link rel="shortcut icon" type="image/svg+xml" href="family-icon.svg">

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #121212; color: #fff; margin: 0; padding: 0; overflow-x: hidden; }

    /* Top Centered Header */
    .top-header { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1c1c1e; border-bottom: 2px solid #333; padding: 12px 15px 0 15px; gap: 12px; }
    .brand-container { display: flex; align-items: center; gap: 10px; }
    .app-header-logo { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
    .app-brand-title { font-size: 26px; font-weight: 900; letter-spacing: -0.5px; color: #fff; margin: 0; display: flex; align-items: center; gap: 8px; }

    .tab-bar { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
    .tab-btn { padding: 8px 16px; font-size: 13px; font-weight: bold; border: none; border-top-left-radius: 8px; border-top-right-radius: 8px; cursor: pointer; color: #fff; opacity: 0.6; transition: opacity 0.2s, background 0.2s; }
    .tab-btn.active { opacity: 1.0; }

    .tab-level1-phone { background: #1b4d2e; border-top: 3px solid #30d158; }
    .tab-level1-phone.active { background: #30d158; color: #000; }
    .tab-level1-text { background: #267340; border-top: 3px solid #63e685; }
    .tab-level1-text.active { background: #63e685; color: #000; }
    .tab-level2 { background: #0a3663; border-top: 3px solid #0a84ff; }
    .tab-level2.active { background: #0a84ff; color: #fff; }
    .tab-maps { background: #5c3800; border-top: 3px solid #ff9500; }
    .tab-maps.active { background: #ff9500; color: #000; }
    .tab-radio { background: #4a0072; border-top: 3px solid #e040fb; }
    .tab-radio.active { background: #e040fb; color: #000; }
    .tab-art { background: #4a3600; border-top: 3px solid #ffd60a; }
    .tab-art.active { background: #ffd60a; color: #000; }
    .tab-game { background: #5a0000; border-top: 3px solid #ff3b30; }
    .tab-game.active { background: #ff3b30; color: #fff; font-weight: 900; }

    .sub-tagline { font-size: 11px; display: block; font-weight: normal; margin-top: 2px; }
    .container { padding: 10px 15px; max-width: 100%; margin: 0 auto; text-align: center; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* CORE WEBPHONE COMPONENTS */
    .webphone-simplified-card { background: #1c1c1e; border: 1px solid #333; border-radius: 16px; max-width: 580px; margin: 15px auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .step-row-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #151516; border: 1px solid #2a2a2d; border-radius: 10px; padding: 12px 14px; }
    .step-title-green { color: #30d158; font-weight: bold; font-size: 14px; white-space: nowrap; text-align: left; }
    .webphone-input-field { flex: 1; padding: 8px 12px; font-size: 14px; border-radius: 6px; background: #2c2c2e; color: #fff; border: 1px solid #444; text-align: left; }
    .btn-round-red { width: 56px; height: 56px; border-radius: 50%; background: #ff3b30; color: #fff; font-size: 10px; font-weight: 900; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(255, 59, 48, 0.35); flex-shrink: 0; text-decoration: none; }
    .btn-round-blue { width: 56px; height: 56px; border-radius: 50%; background: #0a84ff; color: #fff; font-size: 10px; font-weight: 900; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(10, 132, 255, 0.35); flex-shrink: 0; text-decoration: none; }
    .btn-square-start-red { width: 65px; height: 60px; background: #ff3b30; color: #fff; font-size: 10px; font-weight: 900; border-radius: 10px; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-shadow: 0 4px 12px rgba(255, 59, 48, 0.4); flex-shrink: 0; }
    
    .vintage-toggle-panel { display: flex; flex-direction: column; align-items: center; background: #1c1c1e; border: 1px solid #444; border-radius: 10px; padding: 6px 8px; gap: 4px; box-shadow: inset 0 0 6px rgba(0,0,0,0.8); flex-shrink: 0; }
    .toggle-label-group { display: flex; align-items: center; gap: 4px; font-size: 9px; font-weight: bold; color: #aaa; }
    .indicator-light { width: 7px; height: 7px; border-radius: 50%; background: #333; border: 1px solid #555; }
    .indicator-light.active-red { background: #ff3b30; box-shadow: 0 0 6px #ff3b30, 0 0 10px #ff3b30; }
    .switch-container { position: relative; width: 22px; height: 44px; }
    .switch-container input { opacity: 0; width: 0; height: 0; }
    .slider-track { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #2c2c2e; border: 2px solid #555; border-radius: 12px; transition: .2s; }
    .slider-track:before { position: absolute; content: ""; height: 16px; width: 14px; left: 2px; top: 2px; background-color: #aaa; border-radius: 6px; transition: .2s; }
